<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>P-Tech: JumpingMaze</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --viewport-height: 100dvh;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #06070a;
    }
    body {
      position: fixed;
      inset: 0;
      height: var(--viewport-height);
      display: grid;
      place-items: center;
      padding: clamp(0px, 1.8dvh, 14px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button { font: inherit; touch-action: manipulation; }

    #app {
      --bg: #081217;
      --panel: #0d1b21;
      --panel-2: #12262c;
      --text: #eefdfc;
      --muted: #8ba4a8;
      --border: #244047;
      --primary: #54e5d4;
      --primary-dark: #128c80;
      --danger: #e73a50;
      --start: #d6aa20;
      width: min(100%, 680px);
      height: min(820px, 100%);
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(0px, 3vw, 24px);
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 22px 80px rgba(0, 0, 0, .48);
    }
    #app[data-theme="white"] {
      --bg: #f2f8f8;
      --panel: #fff;
      --panel-2: #dcebea;
      --text: #102326;
      --muted: #5f777a;
      --border: #bfd4d3;
      --primary-dark: #087f75;
      color-scheme: light;
    }

    .screen {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding:
        max(clamp(10px, 2.2dvh, 18px), env(safe-area-inset-top))
        max(clamp(10px, 2vw, 18px), env(safe-area-inset-right))
        max(clamp(10px, 2.2dvh, 18px), env(safe-area-inset-bottom))
        max(clamp(10px, 2vw, 18px), env(safe-area-inset-left));
    }
    .hidden { display: none !important; }

    .title-screen, .result-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(15px, 3.5dvh, 30px);
    }
    .eyebrow {
      margin: 0;
      color: var(--primary);
      font-size: clamp(.68rem, 2.4vw, .8rem);
      font-weight: 950;
      letter-spacing: .3em;
    }
    .brand {
      margin: 0;
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: .92;
      font-weight: 1000;
      letter-spacing: .03em;
    }
    .brand span { display: block; color: var(--primary); }
    .lead {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(.82rem, 3vw, 1rem);
      line-height: 1.8;
    }
    .theme-btn, .hub-link {
      position: absolute;
      top: max(4px, env(safe-area-inset-top));
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .09em;
    }
    .theme-btn { right: max(4px, env(safe-area-inset-right)); cursor: pointer; }
    .hub-link { left: max(4px, env(safe-area-inset-left)); text-decoration: none; }
    .primary-btn, .secondary-btn, .exit-btn {
      border: 0;
      cursor: pointer;
      font-weight: 950;
    }
    .primary-btn {
      min-width: 170px;
      min-height: 54px;
      padding: 0 34px;
      border-radius: 14px;
      background: var(--primary);
      color: #06211f;
      letter-spacing: .14em;
      box-shadow: 0 10px 30px rgba(84, 229, 212, .2);
    }
    .secondary-btn {
      min-height: 48px;
      padding: 0 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      letter-spacing: .08em;
    }
    button:active { transform: translateY(1px) scale(.99); }

    .game-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(7px, 1.35dvh, 12px);
    }
    .hud {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .exit-btn {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      font-size: .76rem;
      letter-spacing: .08em;
    }
    .game-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--primary);
      font-size: clamp(.8rem, 3vw, 1rem);
      font-weight: 1000;
      letter-spacing: .08em;
    }
    .status {
      min-width: 120px;
      text-align: right;
      font-size: clamp(.65rem, 2.5vw, .78rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .timer-track {
      width: 100%;
      height: clamp(6px, 1.1dvh, 9px);
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
    }
    .timer-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transform-origin: left center;
      transition: transform .08s linear, background .2s ease;
    }
    .timer-fill.danger { background: var(--danger); }
    .phase-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .phase {
      color: var(--muted);
      font-size: clamp(.7rem, 2.6vw, .84rem);
      font-weight: 900;
      letter-spacing: .05em;
    }
    .time {
      min-width: 54px;
      color: var(--text);
      text-align: right;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .board {
      width: min(100%, 560px, calc(var(--viewport-height) - 178px));
      aspect-ratio: 1;
      flex: 0 1 auto;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: clamp(3px, 1vw, 7px);
      padding: clamp(3px, 1vw, 7px);
      border-radius: 12px;
      background: rgba(0, 0, 0, .14);
    }
    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: clamp(4px, 1.4vw, 8px);
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      color: var(--primary);
      font-size: clamp(1rem, 5vw, 1.55rem);
      font-weight: 1000;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease, color .12s ease, transform .12s ease;
    }
    .cell:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
    .cell:disabled { cursor: default; }
    .cell.start {
      border-color: #cfa91e;
      background: #d4ad2a;
      color: #071316;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .28);
      box-shadow: inset 0 0 0 1px rgba(255, 236, 150, .45);
    }
    .cell.goal {
      border-color: #4bb99e;
      box-shadow: inset 0 0 0 1px rgba(84, 229, 212, .2);
    }
    .cell.correct {
      border-color: #31cbbb;
      background: var(--primary-dark);
      color: #fff;
      box-shadow: 0 0 14px rgba(84, 229, 212, .15);
    }
    .cell.wrong {
      border-color: #ff5368;
      background: color-mix(in srgb, var(--danger) 72%, var(--panel));
      color: #fff;
      animation: wrong .24s ease;
    }
    .board[data-phase="trace"] .cell:not(.correct):not(.wrong) .number { visibility: hidden; }
    .board[data-phase="trace"] .cell.start .number { visibility: hidden; }
    @keyframes wrong {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-4px); }
      70% { transform: translateX(4px); }
    }
    .instruction {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      text-align: center;
      font-size: clamp(.7rem, 2.5vw, .84rem);
      font-weight: 800;
    }

    .result-mark {
      width: clamp(74px, 19vw, 106px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 3px solid currentColor;
      border-radius: 50%;
      color: var(--primary);
      font-size: clamp(2rem, 9vw, 3.6rem);
      font-weight: 1000;
    }
    .result-screen[data-result="fail"] .result-mark { color: var(--danger); }
    .result-title {
      margin: 0;
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: .04em;
    }
    .result-detail { margin: 0; color: var(--muted); font-weight: 800; }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    @media (max-height: 590px) {
      .screen { padding-top: 7px; padding-bottom: 7px; }
      .game-screen { gap: 5px; }
      .phase-row { line-height: 1; }
      .board { width: min(100%, calc(var(--viewport-height) - 126px), 560px); }
      .instruction { min-height: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main id="app" data-theme="black">
    <section id="titleScreen" class="screen title-screen">
      <a class="hub-link" href="../../" aria-label="ゲーム選択へ戻る">← P-TECH</a>
      <button id="themeButton" class="theme-btn" type="button" aria-label="テーマを切り替える">WHITE</button>
      <p class="eyebrow">P-TECH</p>
      <h1 class="brand">JUMPING<span>MAZE</span></h1>
      <p class="lead">数字を記憶し、表示された数だけ右か下へジャンプ。<br />左上から右下までたどれば解除成功。</p>
      <button id="startButton" class="primary-btn" type="button">START</button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden" aria-label="ゲーム画面">
      <header class="hud">
        <button id="exitButton" class="exit-btn" type="button">EXIT</button>
        <div class="game-title">JUMPING MAZE</div>
        <div id="statusText" class="status">到達 0マス　ミス 0/3</div>
      </header>
      <div class="timer-track" aria-hidden="true"><div id="timerFill" class="timer-fill"></div></div>
      <div class="phase-row">
        <span id="phaseText" class="phase">記憶フェーズ</span>
        <span id="timeText" class="time">5.0</span>
      </div>
      <div id="board" class="board" data-phase="memory" role="grid" aria-label="7列7行のジャンピング迷路"></div>
      <p id="instruction" class="instruction" aria-live="polite">左上から右下までの経路を記憶</p>
    </section>

    <section id="resultScreen" class="screen result-screen hidden" data-result="success">
      <div id="resultMark" class="result-mark">✓</div>
      <h2 id="resultTitle" class="result-title">CLEARED</h2>
      <p id="resultDetail" class="result-detail"></p>
      <div class="result-actions">
        <button id="retryButton" class="primary-btn" type="button">RETRY</button>
        <button id="titleButton" class="secondary-btn" type="button">TITLE</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const SIZE = 7;
      const MEMORY_MS = 5000;
      const TRACE_MS = 30000;
      const MAX_MISSES = 3;
      const app = document.getElementById('app');
      const titleScreen = document.getElementById('titleScreen');
      const gameScreen = document.getElementById('gameScreen');
      const resultScreen = document.getElementById('resultScreen');
      const board = document.getElementById('board');
      const phaseText = document.getElementById('phaseText');
      const timeText = document.getElementById('timeText');
      const statusText = document.getElementById('statusText');
      const timerFill = document.getElementById('timerFill');
      const instruction = document.getElementById('instruction');
      const themeButton = document.getElementById('themeButton');
      const resultMark = document.getElementById('resultMark');
      const resultTitle = document.getElementById('resultTitle');
      const resultDetail = document.getElementById('resultDetail');

      let values = [];
      let currentRow = 0;
      let currentCol = 0;
      let reachedCount = 0;
      let misses = 0;
      let phase = 'idle';
      let phaseStartedAt = 0;
      let animationFrame = 0;
      let audioContext = null;

      const showScreen = (screen) => {
        [titleScreen, gameScreen, resultScreen].forEach((item) => item.classList.toggle('hidden', item !== screen));
      };

      const updateViewportHeight = () => {
        const height = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', `${height}px`);
      };

      const setTheme = (theme) => {
        const white = theme === 'white';
        app.dataset.theme = white ? 'white' : 'black';
        themeButton.textContent = white ? 'BLACK' : 'WHITE';
        document.querySelector('meta[name="theme-color"]').content = white ? '#f2f8f8' : '#090a0d';
        try { localStorage.setItem('ptech-theme', app.dataset.theme); } catch (_) {}
      };

      const tone = (frequency, duration = .06, volume = .035) => {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(volume, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + duration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + duration);
        } catch (_) {}
      };

      const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      const splitDistance = (distance) => {
        const pieces = [];
        let remaining = distance;
        while (remaining > 0) {
          const step = randomInt(1, Math.min(3, remaining));
          pieces.push(step);
          remaining -= step;
        }
        return pieces;
      };

      const shuffle = (items) => {
        for (let index = items.length - 1; index > 0; index--) {
          const swapIndex = randomInt(0, index);
          [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
        }
        return items;
      };

      const generateBoard = () => {
        values = Array.from({ length: SIZE }, () =>
          Array.from({ length: SIZE }, () => randomInt(1, 3))
        );

        const moves = shuffle([
          ...splitDistance(SIZE - 1).map((amount) => ({ row: 0, col: amount, amount })),
          ...splitDistance(SIZE - 1).map((amount) => ({ row: amount, col: 0, amount }))
        ]);
        let row = 0;
        let col = 0;
        moves.forEach((move) => {
          values[row][col] = move.amount;
          row += move.row;
          col += move.col;
        });
        values[SIZE - 1][SIZE - 1] = randomInt(1, 3);
      };

      const renderBoard = () => {
        board.replaceChildren();
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'cell';
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.setAttribute('role', 'gridcell');
            cell.setAttribute('aria-label', `${row + 1}行${col + 1}列、数字${values[row][col]}`);
            cell.innerHTML = `<span class="number">${values[row][col]}</span>`;
            if (row === 0 && col === 0) cell.classList.add('start');
            if (row === SIZE - 1 && col === SIZE - 1) cell.classList.add('goal');
            cell.disabled = true;
            cell.addEventListener('click', onCellClick);
            board.appendChild(cell);
          }
        }
      };

      const updateStatus = () => {
        statusText.textContent = `到達 ${reachedCount}マス　ミス ${misses}/${MAX_MISSES}`;
      };

      const startTrace = () => {
        phase = 'trace';
        phaseStartedAt = performance.now();
        phaseText.textContent = '追跡フェーズ';
        timeText.textContent = '30.0';
        timerFill.style.transform = 'scaleX(1)';
        timerFill.classList.remove('danger');
        board.dataset.phase = 'trace';
        board.querySelectorAll('.cell').forEach((cell) => { cell.disabled = false; });
        instruction.textContent = '記憶した経路をたどる';
        animationFrame = requestAnimationFrame(updateTimer);
        tone(520, .08, .03);
      };

      function onCellClick(event) {
        if (phase !== 'trace') return;
        const cell = event.currentTarget;
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);
        const jump = values[currentRow][currentCol];
        const movesRight = row === currentRow && col - currentCol === jump;
        const movesDown = col === currentCol && row - currentRow === jump;
        if (movesRight || movesDown) {
          currentRow = row;
          currentCol = col;
          reachedCount++;
          cell.classList.remove('wrong');
          cell.classList.add('correct');
          updateStatus();
          tone(370 + Math.min(reachedCount, 10) * 28, .07, .03);
          if (row === SIZE - 1 && col === SIZE - 1) finish(true, `${reachedCount}マスで右下へ到達`);
          return;
        }

        misses++;
        cell.classList.remove('wrong');
        void cell.offsetWidth;
        cell.classList.add('wrong');
        updateStatus();
        tone(145, .11, .035);
        if (misses >= MAX_MISSES) finish(false, `${reachedCount}マス到達・ミス ${misses}/${MAX_MISSES}`, 'FAILED');
      }

      const updateTimer = (now) => {
        if (phase !== 'memory' && phase !== 'trace') return;
        const limit = phase === 'memory' ? MEMORY_MS : TRACE_MS;
        const remaining = Math.max(0, limit - (now - phaseStartedAt));
        timeText.textContent = (remaining / 1000).toFixed(1);
        const ratio = remaining / limit;
        timerFill.style.transform = `scaleX(${ratio})`;
        timerFill.classList.toggle('danger', ratio <= .25);
        if (remaining <= 0) {
          if (phase === 'memory') startTrace();
          else finish(false, `${reachedCount}マス到達・ミス ${misses}/${MAX_MISSES}`, 'TIME UP');
          return;
        }
        animationFrame = requestAnimationFrame(updateTimer);
      };

      const startGame = () => {
        cancelAnimationFrame(animationFrame);
        generateBoard();
        currentRow = 0;
        currentCol = 0;
        reachedCount = 0;
        misses = 0;
        phase = 'memory';
        phaseStartedAt = performance.now();
        renderBoard();
        board.dataset.phase = 'memory';
        phaseText.textContent = '記憶フェーズ';
        timeText.textContent = '5.0';
        timerFill.style.transform = 'scaleX(1)';
        timerFill.classList.remove('danger');
        instruction.textContent = '左上から右下までの経路を記憶';
        updateStatus();
        showScreen(gameScreen);
        animationFrame = requestAnimationFrame(updateTimer);
      };

      const finish = (success, detail, title = '') => {
        if (phase !== 'memory' && phase !== 'trace') return;
        phase = 'result';
        cancelAnimationFrame(animationFrame);
        board.querySelectorAll('.cell').forEach((cell) => { cell.disabled = true; });
        resultScreen.dataset.result = success ? 'success' : 'fail';
        resultMark.textContent = success ? '✓' : '×';
        resultTitle.textContent = title || (success ? 'CLEARED' : 'FAILED');
        resultDetail.textContent = detail;
        showScreen(resultScreen);
        if (success) {
          tone(523, .12, .045);
          window.setTimeout(() => tone(659, .12, .045), 100);
          window.setTimeout(() => tone(784, .18, .045), 200);
        } else {
          tone(180, .18, .045);
        }
      };

      const goToTitle = () => {
        phase = 'idle';
        cancelAnimationFrame(animationFrame);
        showScreen(titleScreen);
      };

      document.getElementById('startButton').addEventListener('click', startGame);
      document.getElementById('retryButton').addEventListener('click', startGame);
      document.getElementById('titleButton').addEventListener('click', goToTitle);
      document.getElementById('exitButton').addEventListener('click', goToTitle);
      themeButton.addEventListener('click', () => setTheme(app.dataset.theme === 'white' ? 'black' : 'white'));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !gameScreen.classList.contains('hidden')) goToTitle();
        if ((event.key === 'Enter' || event.key === ' ') && !titleScreen.classList.contains('hidden')) startGame();
      });
      window.addEventListener('resize', updateViewportHeight);
      window.visualViewport?.addEventListener('resize', updateViewportHeight);
      window.addEventListener('pageshow', updateViewportHeight);
      updateViewportHeight();
      let storedTheme = 'black';
      try { storedTheme = localStorage.getItem('ptech-theme') || 'black'; } catch (_) {}
      setTheme(storedTheme);
    })();
  </script>
</body>
</html>
