<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110e" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>P-Tech: HexTrace</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --viewport-height: 100dvh;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #030805;
    }
    body {
      position: fixed;
      inset: 0;
      height: var(--viewport-height);
      display: grid;
      place-items: center;
      padding: clamp(0px, 1.8dvh, 14px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; touch-action: manipulation; }

    #app {
      --bg: #07110e;
      --panel: #0c1c17;
      --panel-2: #132a22;
      --text: #effff7;
      --muted: #83a99a;
      --border: #244b3d;
      --primary: #49f2a7;
      --correct: #8dffcc;
      --danger: #ff5b72;
      width: min(100%, 680px);
      height: min(820px, 100%);
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(0px, 3vw, 24px);
      color: var(--text);
      background:
        linear-gradient(rgba(73, 242, 167, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(73, 242, 167, .025) 1px, transparent 1px),
        radial-gradient(circle at 50% -10%, rgba(73, 242, 167, .14), transparent 37%),
        var(--bg);
      background-size: 24px 24px, 24px 24px, auto, auto;
      box-shadow: 0 22px 80px rgba(0, 0, 0, .5);
    }
    #app[data-theme="white"] {
      --bg: #f3faf7;
      --panel: #fff;
      --panel-2: #dcefe7;
      --text: #102b21;
      --muted: #5a7d70;
      --border: #badbce;
      color-scheme: light;
    }
    .screen {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding:
        max(clamp(10px, 2.2dvh, 18px), env(safe-area-inset-top))
        max(clamp(10px, 2vw, 18px), env(safe-area-inset-right))
        max(clamp(10px, 2.2dvh, 18px), env(safe-area-inset-bottom))
        max(clamp(10px, 2vw, 18px), env(safe-area-inset-left));
    }
    .hidden { display: none !important; }
    .title-screen, .result-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(15px, 3.5dvh, 30px);
      text-align: center;
    }
    .eyebrow { margin: 0; color: var(--primary); font-size: clamp(.68rem, 2.4vw, .8rem); font-weight: 950; letter-spacing: .3em; }
    .brand { margin: 0; font-size: clamp(2rem, 9vw, 4.2rem); line-height: .87; font-weight: 1000; letter-spacing: -.03em; }
    .brand span { display: block; color: var(--primary); }
    .lead { max-width: 35rem; margin: 0; color: var(--muted); font-size: clamp(.82rem, 3vw, 1rem); line-height: 1.8; }
    .theme-btn, .hub-link {
      position: absolute;
      top: max(4px, env(safe-area-inset-top));
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .09em;
    }
    .theme-btn { right: max(4px, env(safe-area-inset-right)); cursor: pointer; }
    .hub-link { left: max(4px, env(safe-area-inset-left)); text-decoration: none; }
    .primary-btn, .secondary-btn, .exit-btn { border: 0; cursor: pointer; font-weight: 950; }
    .primary-btn { min-width: 170px; min-height: 54px; padding: 0 34px; border-radius: 14px; background: var(--primary); color: #05261a; letter-spacing: .14em; box-shadow: 0 10px 30px rgba(73, 242, 167, .18); }
    .secondary-btn { min-height: 48px; padding: 0 28px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text); letter-spacing: .08em; }
    button:active { transform: translateY(1px) scale(.99); }

    .game-screen { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }
    .hud { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    .exit-btn { min-height: 38px; padding: 0 13px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); color: var(--text); font-size: .76rem; letter-spacing: .08em; }
    .game-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--primary); font-size: clamp(.76rem, 2.8vw, 1rem); font-weight: 1000; letter-spacing: .06em; }
    .status { min-width: 126px; text-align: right; font-size: clamp(.58rem, 2.15vw, .72rem); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .timer-track { width: 100%; height: clamp(7px, 1.2dvh, 10px); overflow: hidden; border-radius: 999px; background: var(--panel-2); }
    .timer-fill { width: 100%; height: 100%; border-radius: inherit; background: var(--primary); transform-origin: left center; transition: transform .08s linear, background .15s ease; }
    .timer-fill.danger { background: var(--danger); }

    .target-panel {
      width: min(100%, 590px);
      padding: clamp(8px, 1.5dvh, 13px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
    }
    .target-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .target-label { color: var(--muted); font: 900 clamp(.58rem, 2vw, .7rem)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .13em; }
    .time { font-size: clamp(.95rem, 3.5vw, 1.2rem); font-weight: 1000; font-variant-numeric: tabular-nums; }
    .targets { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(3px, 1vw, 7px); }
    .target {
      min-width: 0;
      min-height: clamp(34px, 5.8dvh, 45px);
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      font: 900 clamp(.57rem, 2.2vw, .8rem)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .target.current { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 16%, var(--panel)); color: var(--primary); box-shadow: 0 0 14px rgba(73, 242, 167, .14); }
    .target.done { border-color: var(--correct); background: color-mix(in srgb, var(--correct) 20%, var(--panel)); color: var(--correct); }

    .grid {
      width: min(100%, 590px);
      flex: 1 1 auto;
      min-height: 240px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: clamp(4px, 1vw, 8px);
    }
    .hex {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: clamp(7px, 1.5vw, 11px);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font: 900 clamp(.68rem, 2.9vw, 1rem)/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .03em;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .13);
    }
    .hex:hover { border-color: var(--primary); }
    .hex.correct { border-color: var(--correct); background: var(--correct); color: #05261a; opacity: .16; pointer-events: none; }
    .hex.wrong { border-color: var(--danger); background: var(--danger); color: #fff; }
    .instruction { min-height: 19px; margin: 0; color: var(--muted); text-align: center; font-size: clamp(.65rem, 2.3vw, .8rem); font-weight: 850; }

    .result-mark { width: clamp(74px, 19vw, 106px); aspect-ratio: 1; display: grid; place-items: center; border: 3px solid currentColor; border-radius: 50%; color: var(--correct); font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 1000; }
    .result-screen[data-result="fail"] .result-mark { color: var(--danger); }
    .result-title { margin: 0; font-size: clamp(2rem, 9vw, 4rem); line-height: 1; font-weight: 1000; letter-spacing: .04em; }
    .result-detail { margin: 0; color: var(--muted); font-weight: 800; }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    @media (max-height: 590px) {
      .screen { padding-top: 7px; padding-bottom: 7px; }
      .game-screen { gap: 4px; }
      .target-panel { padding: 5px 8px; }
      .target-head { margin-bottom: 4px; }
      .target { min-height: 27px; }
      .grid { min-height: 178px; gap: 3px; }
      .instruction { min-height: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main id="app" data-theme="black">
    <section id="titleScreen" class="screen title-screen">
      <a class="hub-link" href="../../" aria-label="ゲーム選択へ戻る">← P-TECH</a>
      <button id="themeButton" class="theme-btn" type="button" aria-label="テーマを切り替える">WHITE</button>
      <p class="eyebrow">P-TECH</p>
      <h1 class="brand">HEX<span>TRACE</span></h1>
      <p class="lead">端末内に散らばる16進コードを走査。<br />指定された6コードを順番どおり追跡せよ。</p>
      <button id="startButton" class="primary-btn" type="button">START</button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden" aria-label="ゲーム画面">
      <header class="hud">
        <button id="exitButton" class="exit-btn" type="button">EXIT</button>
        <div class="game-title">HEX TRACE</div>
        <div id="statusText" class="status">TRACE 0/6　MISS 0/3</div>
      </header>
      <div class="timer-track" aria-hidden="true"><div id="timerFill" class="timer-fill"></div></div>
      <section class="target-panel" aria-label="追跡ターゲット">
        <div class="target-head">
          <span class="target-label">TARGET SEQUENCE</span>
          <span id="timeText" class="time">30.0</span>
        </div>
        <div id="targets" class="targets"></div>
      </section>
      <div id="grid" class="grid" aria-label="コード一覧"></div>
      <p id="instruction" class="instruction" aria-live="polite">光っているターゲットと同じコードを選択</p>
    </section>

    <section id="resultScreen" class="screen result-screen hidden" data-result="success">
      <div id="resultMark" class="result-mark">✓</div>
      <h2 id="resultTitle" class="result-title">CLEARED</h2>
      <p id="resultDetail" class="result-detail"></p>
      <div class="result-actions">
        <button id="retryButton" class="primary-btn" type="button">RETRY</button>
        <button id="titleButton" class="secondary-btn" type="button">TITLE</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const GRID_SIZE = 30;
      const TARGET_COUNT = 6;
      const MAX_MISSES = 3;
      const TIME_LIMIT_MS = 30000;
      const app = document.getElementById('app');
      const titleScreen = document.getElementById('titleScreen');
      const gameScreen = document.getElementById('gameScreen');
      const resultScreen = document.getElementById('resultScreen');
      const gridElement = document.getElementById('grid');
      const targetsElement = document.getElementById('targets');
      const statusText = document.getElementById('statusText');
      const timeText = document.getElementById('timeText');
      const timerFill = document.getElementById('timerFill');
      const instruction = document.getElementById('instruction');
      const themeButton = document.getElementById('themeButton');
      const resultMark = document.getElementById('resultMark');
      const resultTitle = document.getElementById('resultTitle');
      const resultDetail = document.getElementById('resultDetail');

      let codes = [];
      let targets = [];
      let cursor = 0;
      let misses = 0;
      let phase = 'idle';
      let startedAt = 0;
      let animationFrame = 0;
      let audioContext = null;

      const showScreen = (screen) => {
        [titleScreen, gameScreen, resultScreen].forEach((item) => item.classList.toggle('hidden', item !== screen));
      };
      const updateViewportHeight = () => {
        const height = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', `${height}px`);
      };
      const setTheme = (theme) => {
        const white = theme === 'white';
        app.dataset.theme = white ? 'white' : 'black';
        themeButton.textContent = white ? 'BLACK' : 'WHITE';
        document.querySelector('meta[name="theme-color"]').content = white ? '#f3faf7' : '#07110e';
        try { localStorage.setItem('ptech-theme', app.dataset.theme); } catch (_) {}
      };
      const tone = (frequency, duration = .06, volume = .03) => {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'square';
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(volume, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + duration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + duration);
        } catch (_) {}
      };
      const randomHex = () => Math.floor(Math.random() * 0x10000).toString(16).toUpperCase().padStart(4, '0');
      const buildPuzzle = () => {
        const unique = new Set();
        while (unique.size < GRID_SIZE) unique.add(randomHex());
        codes = [...unique];
        const shuffled = [...codes].sort(() => Math.random() - .5);
        targets = shuffled.slice(0, TARGET_COUNT);
      };
      const renderPuzzle = () => {
        gridElement.replaceChildren(...codes.map((code) => {
          const button = document.createElement('button');
          button.className = 'hex';
          button.type = 'button';
          button.dataset.code = code;
          button.textContent = code;
          button.setAttribute('aria-label', `コード ${code}`);
          return button;
        }));
        targetsElement.replaceChildren(...targets.map((code, index) => {
          const item = document.createElement('span');
          item.className = `target${index === 0 ? ' current' : ''}`;
          item.textContent = code;
          return item;
        }));
      };
      const updateTargets = () => {
        [...targetsElement.children].forEach((item, index) => {
          item.classList.toggle('done', index < cursor);
          item.classList.toggle('current', index === cursor);
        });
      };
      const updateStatus = () => { statusText.textContent = `TRACE ${cursor}/${TARGET_COUNT}　MISS ${misses}/${MAX_MISSES}`; };
      const finish = (success, title = '') => {
        if (phase !== 'playing') return;
        phase = 'result';
        cancelAnimationFrame(animationFrame);
        const elapsed = Math.min(TIME_LIMIT_MS, performance.now() - startedAt) / 1000;
        resultScreen.dataset.result = success ? 'success' : 'fail';
        resultMark.textContent = success ? '✓' : '×';
        resultTitle.textContent = title || (success ? 'CLEARED' : 'FAILED');
        resultDetail.textContent = `${cursor}/${TARGET_COUNT} TRACE・MISS ${misses}/${MAX_MISSES}・${elapsed.toFixed(1)} SEC`;
        window.setTimeout(() => showScreen(resultScreen), success ? 120 : 240);
        if (success) {
          tone(523, .12, .04);
          window.setTimeout(() => tone(659, .12, .04), 95);
          window.setTimeout(() => tone(784, .16, .04), 190);
        } else tone(155, .16, .04);
      };
      const chooseCode = (button) => {
        if (phase !== 'playing' || button.classList.contains('correct')) return;
        const code = button.dataset.code;
        if (code !== targets[cursor]) {
          misses++;
          button.classList.remove('wrong');
          void button.offsetWidth;
          button.classList.add('wrong');
          window.setTimeout(() => button.classList.remove('wrong'), 180);
          instruction.textContent = `MISS — ${targets[cursor]} を探索`;
          tone(150, .1, .035);
          updateStatus();
          if (misses >= MAX_MISSES) finish(false, 'TRACE LOST');
          return;
        }
        button.classList.add('correct');
        cursor++;
        updateTargets();
        updateStatus();
        instruction.textContent = cursor === TARGET_COUNT ? 'TRACE COMPLETE' : `NEXT — ${targets[cursor]}`;
        tone(460 + cursor * 42);
        if (cursor === TARGET_COUNT) finish(true);
      };
      const tick = (now) => {
        if (phase !== 'playing') return;
        const remaining = Math.max(0, TIME_LIMIT_MS - (now - startedAt));
        const ratio = remaining / TIME_LIMIT_MS;
        timeText.textContent = (remaining / 1000).toFixed(1);
        timerFill.style.transform = `scaleX(${ratio})`;
        timerFill.classList.toggle('danger', ratio <= .22);
        if (remaining <= 0) {
          finish(false, 'TIME UP');
          return;
        }
        animationFrame = requestAnimationFrame(tick);
      };
      const startGame = () => {
        cancelAnimationFrame(animationFrame);
        buildPuzzle();
        renderPuzzle();
        cursor = 0;
        misses = 0;
        phase = 'playing';
        startedAt = performance.now();
        updateStatus();
        timeText.textContent = (TIME_LIMIT_MS / 1000).toFixed(1);
        timerFill.style.transform = 'scaleX(1)';
        timerFill.classList.remove('danger');
        instruction.textContent = '光っているターゲットと同じコードを選択';
        showScreen(gameScreen);
        animationFrame = requestAnimationFrame(tick);
      };
      const goToTitle = () => {
        phase = 'idle';
        cancelAnimationFrame(animationFrame);
        showScreen(titleScreen);
      };

      gridElement.addEventListener('pointerdown', (event) => {
        const button = event.target.closest('.hex');
        if (!button) return;
        event.preventDefault();
        chooseCode(button);
      });
      document.getElementById('startButton').addEventListener('click', startGame);
      document.getElementById('retryButton').addEventListener('click', startGame);
      document.getElementById('titleButton').addEventListener('click', goToTitle);
      document.getElementById('exitButton').addEventListener('click', goToTitle);
      themeButton.addEventListener('click', () => setTheme(app.dataset.theme === 'white' ? 'black' : 'white'));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !gameScreen.classList.contains('hidden')) goToTitle();
        if ((event.key === 'Enter' || event.key === ' ') && !titleScreen.classList.contains('hidden')) startGame();
      });
      window.addEventListener('resize', updateViewportHeight);
      window.visualViewport?.addEventListener('resize', updateViewportHeight);
      window.addEventListener('pageshow', updateViewportHeight);
      updateViewportHeight();
      let storedTheme = 'black';
      try { storedTheme = localStorage.getItem('ptech-theme') || 'black'; } catch (_) {}
      setTheme(storedTheme);
    })();
  </script>
</body>
</html>
