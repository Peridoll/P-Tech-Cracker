<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090c" />
  <title>P-Tech</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --viewport-height: 100dvh;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #050609;
    }
    body {
      position: fixed;
      inset: 0;
      height: var(--viewport-height);
      display: grid;
      place-items: center;
      padding: clamp(0px, 1.8dvh, 14px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button, a { font: inherit; touch-action: manipulation; }

    #app {
      --bg: #08090c;
      --panel: #12141a;
      --panel-2: #1a1d25;
      --text: #f7f8fb;
      --muted: #8d94a3;
      --border: #2a2f39;
      --accent: #ff671f;
      --accent-soft: rgba(255, 103, 31, .14);
      width: min(100%, 880px);
      height: min(840px, 100%);
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(0px, 3vw, 26px);
      background:
        radial-gradient(circle at 50% -15%, var(--accent-soft), transparent 38%),
        var(--bg);
      color: var(--text);
      box-shadow: 0 24px 90px rgba(0,0,0,.48);
    }
    #app[data-theme="white"] {
      --bg: #f3f5f8;
      --panel: #fff;
      --panel-2: #e7eaf0;
      --text: #11151c;
      --muted: #687080;
      --border: #ccd2dc;
      --accent-soft: rgba(255, 103, 31, .1);
      color-scheme: light;
    }
    .screen {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding:
        max(clamp(12px, 2.5dvh, 24px), env(safe-area-inset-top))
        max(clamp(12px, 2.5vw, 24px), env(safe-area-inset-right))
        max(clamp(12px, 2.5dvh, 24px), env(safe-area-inset-bottom))
        max(clamp(12px, 2.5vw, 24px), env(safe-area-inset-left));
    }
    .hidden { display: none !important; }
    .theme-btn, .back-btn, .start-btn {
      border: 0;
      cursor: pointer;
      font-weight: 950;
    }
    .theme-btn, .back-btn {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font-size: 11px;
      letter-spacing: .1em;
    }
    button:active, a:active { transform: translateY(1px) scale(.99); }

    .title-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(15px, 3.5dvh, 30px);
    }
    .title-screen .theme-btn {
      position: absolute;
      top: max(4px, env(safe-area-inset-top));
      right: max(4px, env(safe-area-inset-right));
    }
    .system-label {
      margin: 0;
      color: var(--accent);
      font-size: clamp(.68rem, 2.2vw, .8rem);
      font-weight: 950;
      letter-spacing: .34em;
    }
    .brand {
      margin: 0;
      font-size: clamp(4rem, 18vw, 8.5rem);
      line-height: .8;
      font-weight: 1000;
      letter-spacing: -.07em;
    }
    .brand-mark { color: var(--accent); }
    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.75rem, 2.7vw, .95rem);
      font-weight: 850;
      letter-spacing: .12em;
    }
    .start-btn {
      min-width: 190px;
      min-height: 55px;
      margin-top: clamp(5px, 2dvh, 18px);
      padding: 0 34px;
      border-radius: 15px;
      background: var(--accent);
      color: #fff;
      letter-spacing: .16em;
      box-shadow: 0 12px 34px rgba(255,103,31,.27);
    }
    .version {
      position: absolute;
      bottom: max(4px, env(safe-area-inset-bottom));
      margin: 0;
      color: var(--muted);
      font-size: .64rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .select-screen {
      display: flex;
      flex-direction: column;
      gap: clamp(9px, 1.8dvh, 16px);
    }
    .menu-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .menu-header .back-btn { justify-self: start; }
    .menu-header .theme-btn { justify-self: end; }
    .menu-logo {
      font-size: clamp(.9rem, 3.5vw, 1.15rem);
      font-weight: 1000;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .menu-logo span { color: var(--accent); }
    .select-heading {
      margin: 0;
      font-size: clamp(1.45rem, 5.5vw, 2.2rem);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: .04em;
    }
    .select-subtitle {
      margin: -3px 0 0;
      color: var(--muted);
      font-size: clamp(.68rem, 2.5vw, .82rem);
    }
    .games {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(150px, 1fr);
      gap: clamp(8px, 1.5vw, 13px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .game-card {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
      padding: clamp(12px, 2.4vw, 22px);
      border: 1px solid var(--border);
      border-radius: clamp(14px, 2.5vw, 20px);
      background: linear-gradient(145deg, color-mix(in srgb, var(--panel) 92%, var(--card-color)), var(--panel));
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      isolation: isolate;
      transition: border-color .14s ease, transform .14s ease;
    }
    .game-card::after {
      content: attr(data-number);
      position: absolute;
      right: clamp(8px, 2vw, 18px);
      bottom: clamp(-16px, -2vw, -7px);
      z-index: -1;
      color: color-mix(in srgb, var(--card-color) 16%, transparent);
      font-size: clamp(5rem, 16vw, 9rem);
      line-height: 1;
      font-weight: 1000;
    }
    .game-card:hover:not(.disabled) { border-color: var(--card-color); transform: translateY(-2px); }
    .game-card.disabled { opacity: .5; cursor: default; }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .location {
      color: var(--card-color);
      font-size: clamp(.63rem, 2.2vw, .75rem);
      font-weight: 950;
      letter-spacing: .16em;
    }
    .status {
      padding: 4px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--card-color) 14%, transparent);
      color: var(--card-color);
      font-size: clamp(.55rem, 1.8vw, .66rem);
      font-weight: 950;
      letter-spacing: .08em;
    }
    .game-name {
      margin: auto 0 0;
      font-size: clamp(1.25rem, 4.8vw, 2rem);
      line-height: .95;
      font-weight: 1000;
      letter-spacing: -.02em;
    }
    .game-description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(.65rem, 2.3vw, .8rem);
      line-height: 1.35;
    }
    .launch {
      align-self: flex-end;
      color: var(--card-color);
      font-size: clamp(.64rem, 2.1vw, .75rem);
      font-weight: 950;
      letter-spacing: .12em;
    }

    @media (max-width: 560px) {
      body { padding: 0; }
      #app { width: 100%; height: 100%; border: 0; border-radius: 0; }
      .games {
        grid-template-columns: 1fr;
        grid-auto-rows: minmax(105px, 1fr);
      }
      .game-card { flex-direction: row; align-items: center; }
      .game-card > div:nth-child(2) { flex: 1; }
      .game-name { margin-top: 0; }
      .launch { align-self: center; white-space: nowrap; }
      .game-card::after { font-size: clamp(4rem, 24vw, 7rem); }
    }
    @media (max-height: 610px) {
      .select-screen { gap: 6px; }
      .select-subtitle { display: none; }
      .game-card { padding: 9px 12px; gap: 5px; }
      .game-description { display: none; }
      .card-top { display: block; }
      .status { display: inline-block; margin-left: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main id="app" data-theme="black">
    <section id="titleScreen" class="screen title-screen">
      <button class="theme-btn" type="button" data-theme-toggle>WHITE</button>
      <p class="system-label">MINIGAME TRAINING SYSTEM</p>
      <h1 class="brand"><span class="brand-mark">P</span>-Tech</h1>
      <p class="tagline">PRACTICE. REPEAT. COMPLETE.</p>
      <button id="enterButton" class="start-btn" type="button">ENTER</button>
      <p class="version">TRAINING TERMINAL v1.0</p>
    </section>

    <section id="selectScreen" class="screen select-screen hidden">
      <header class="menu-header">
        <button id="backButton" class="back-btn" type="button">← TITLE</button>
        <div class="menu-logo"><span>P</span>-Tech</div>
        <button class="theme-btn" type="button" data-theme-toggle>WHITE</button>
      </header>
      <h2 class="select-heading">SELECT GAME</h2>
      <p class="select-subtitle">練習するギミックを選択してください</p>

      <div id="games" class="games" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const titleScreen = document.getElementById('titleScreen');
      const selectScreen = document.getElementById('selectScreen');
      const themeButtons = document.querySelectorAll('[data-theme-toggle]');
      const gamesElement = document.getElementById('games');

      const fallbackGames = [
        {
          id: 'code-cracker',
          title: 'CODE CRACKER',
          label: 'ATM',
          description: '4桁のコードを解析する数字推理ギミック',
          href: 'games/code-cracker/',
          status: 'PLAYABLE',
          color: '#55c7ff',
          enabled: true
        },
        {
          id: 'chain-braker',
          title: 'CHAIN BRAKER',
          label: 'OIL RIG',
          description: '同色ブロックをつなげて全消去するギミック',
          href: 'games/chain-braker/?v=20260917-2',
          status: 'PLAYABLE',
          color: '#ff671f',
          enabled: true
        },
        {
          id: 'jumping-maze',
          title: 'JUMPING MAZE',
          label: 'OIL RIG',
          description: '数字を記憶して左上から右下へ跳ぶギミック',
          href: 'games/jumping-maze/?v=20260917-1',
          status: 'PLAYABLE',
          color: '#a982ff',
          enabled: true
        },
        {
          id: 'card-memory',
          title: 'CARD MEMORY',
          label: 'OIL RIG',
          description: '本物の番号とカードの色・図形を結びつける記憶ギミック',
          href: 'games/card-memory/?v=20260917-1',
          status: 'PLAYABLE',
          color: '#52e5d4',
          enabled: true
        },
        {
          id: 'flash-grid',
          title: 'FLASH GRID',
          label: 'MULTI-USE',
          description: '点灯したマスの位置を記憶して再現するグリッドギミック',
          href: 'games/flash-grid/?v=20260918-2',
          status: 'PLAYABLE',
          color: '#ffd34e',
          enabled: true
        },
        {
          id: 'circuit-link',
          title: 'CIRCUIT LINK',
          label: 'MULTI-USE',
          description: '接続点を動かして配線の交差をすべて解消するギミック',
          href: 'games/circuit-link/?v=20260918-1',
          status: 'PLAYABLE',
          color: '#6df0ff',
          enabled: true
        },
        {
          id: 'rapid-sequence',
          title: 'RAPID SEQUENCE',
          label: 'MULTI-USE',
          description: '4レーンを流れる信号に合わせて入力する反射ギミック',
          href: 'games/rapid-sequence/?v=20260918-1',
          status: 'PLAYABLE',
          color: '#ff62d0',
          enabled: true
        }
      ];

      const updateViewportHeight = () => {
        const height = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', `${height}px`);
      };

      const setTheme = (theme) => {
        const white = theme === 'white';
        app.dataset.theme = white ? 'white' : 'black';
        themeButtons.forEach((button) => button.textContent = white ? 'BLACK' : 'WHITE');
        document.querySelector('meta[name="theme-color"]').content = white ? '#f3f5f8' : '#08090c';
        try { localStorage.setItem('ptech-theme', app.dataset.theme); } catch (_) {}
      };

      const show = (screen) => {
        titleScreen.classList.toggle('hidden', screen !== titleScreen);
        selectScreen.classList.toggle('hidden', screen !== selectScreen);
      };

      const textOr = (value, fallback) => typeof value === 'string' && value.trim() ? value.trim() : fallback;

      const appendTitle = (element, title) => {
        textOr(title, 'MINI GAME').split(/\s+/).forEach((word, index) => {
          if (index) element.appendChild(document.createElement('br'));
          element.appendChild(document.createTextNode(word));
        });
      };

      const renderGames = (games) => {
        gamesElement.replaceChildren();
        games.forEach((game, index) => {
          const enabled = game.enabled !== false && typeof game.href === 'string' && game.href.trim();
          const card = document.createElement(enabled ? 'a' : 'div');
          card.className = `game-card${enabled ? '' : ' disabled'}`;
          card.style.setProperty('--card-color', textOr(game.color, '#9aa4b2'));
          card.dataset.number = String(index + 1).padStart(2, '0');
          if (enabled) card.href = game.href.trim();
          else card.setAttribute('aria-disabled', 'true');

          const top = document.createElement('div');
          top.className = 'card-top';
          const label = document.createElement('span');
          label.className = 'location';
          label.textContent = textOr(game.label, 'TRAINING');
          const status = document.createElement('span');
          status.className = 'status';
          status.textContent = textOr(game.status, enabled ? 'PLAYABLE' : 'COMING SOON');
          top.append(label, status);

          const content = document.createElement('div');
          const name = document.createElement('h3');
          name.className = 'game-name';
          appendTitle(name, game.title);
          const description = document.createElement('p');
          description.className = 'game-description';
          description.textContent = textOr(game.description, 'ミニゲームの練習モード');
          content.append(name, description);

          const launch = document.createElement('span');
          launch.className = 'launch';
          launch.textContent = enabled ? 'START →' : 'LOCKED';
          card.append(top, content, launch);
          gamesElement.appendChild(card);
        });
      };

      const loadGames = async () => {
        renderGames(fallbackGames);
        try {
          const response = await fetch(`games.json?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Config unavailable');
          const config = await response.json();
          if (Array.isArray(config.games) && config.games.length) renderGames(config.games);
        } catch (_) {}
      };

      document.getElementById('enterButton').addEventListener('click', () => show(selectScreen));
      document.getElementById('backButton').addEventListener('click', () => show(titleScreen));
      themeButtons.forEach((button) => button.addEventListener('click', () => setTheme(app.dataset.theme === 'white' ? 'black' : 'white')));
      document.addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && !titleScreen.classList.contains('hidden')) show(selectScreen);
        if (event.key === 'Escape' && !selectScreen.classList.contains('hidden')) show(titleScreen);
      });
      window.addEventListener('resize', updateViewportHeight);
      window.visualViewport?.addEventListener('resize', updateViewportHeight);
      updateViewportHeight();
      loadGames();
      let storedTheme = 'black';
      try { storedTheme = localStorage.getItem('ptech-theme') || 'black'; } catch (_) {}
      setTheme(storedTheme);
    })();
  </script>
</body>
</html>
